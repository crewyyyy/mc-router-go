# EXPERIMENTAL: Linux IPv4 source-IP-preserving TCP proxy.
# Requires the matching network namespace/deployment. See deploy/NETWORK.md.
# This is NOT a drop-in config for loopback Minecraft listeners.
[server]
listen = "0.0.0.0:25565"

[routes]
"horizon.example.com" = "10.203.76.2:25567"

[default]
backend = "10.203.76.2:25568"

[limits]
max_connections = 256
max_pending_handshakes = 64
max_connections_per_ip = 64
max_ip_entries = 4096
connection_rate = 50.0
connection_burst = 200
ip_connection_rate = 10.0
ip_connection_burst = 40
ip_entry_ttl = "10m"
handshake_timeout = "5s"
handshake_max_bytes = 2048
dial_timeout = "3s"
write_timeout = "15s"
idle_timeout = "30m"
half_close_timeout = "5s"
shutdown_timeout = "10s"
stats_interval = "30s"

[transparent]
enabled = true

[logging]
level = "info"
