# Install this drop-in ONLY together with a working namespace return path and
# transparent=true configuration. Never setcap the shared Python/Go toolchain.
[Unit]
Requires=mc-router-go-network.service
After=mc-router-go-network.service

[Service]
CapabilityBoundingSet=CAP_NET_RAW
AmbientCapabilities=CAP_NET_RAW
